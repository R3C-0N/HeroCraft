[package]
name = "herocraft_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "herocraft_client"
path = "src/main.rs"

[dependencies]
herocraft_common = { path = "../common" }
herocraft_voxel_engine = { path = "../voxel_engine" }
herocraft_world = { path = "../world" }
herocraft_server = { path = "../server" }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
wgpu = { version = "23", features = ["naga-ir"] }
winit = { version = "0.29", features = ["serde"] }
pollster = "0.3"
dotenvy = "0.15"
bytemuck = { version = "1.18", features = ["derive"] }
rayon = "1.10"
egui = "0.30"
egui-wgpu = "0.30"
naga = "23"
naga_oil = { version = "0.16", default-features = false }
png = "0.17"
base64 = "0.22"

# Crochet clavier : les touches du jeu passent avant PowerToys et les autres programmes
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[features]
# cargo run --release --features profiling --bin herocraft_client
profiling = ["herocraft_common/profiling"]

[dev-dependencies]
naga = { version = "23", features = ["wgsl-in"] }
