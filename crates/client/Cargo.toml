[package]
name = "herocraft_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "herocraft_client"
path = "src/main.rs"

[dependencies]
herocraft_common = { path = "../common" }
herocraft_voxel_engine = { path = "../voxel_engine" }
herocraft_world = { path = "../world" }
glam = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
wgpu = "23"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1.18", features = ["derive"] }
rayon = "1.10"
egui = "0.30"
egui-wgpu = "0.30"

[dev-dependencies]
naga = { version = "23", features = ["wgsl-in"] }
