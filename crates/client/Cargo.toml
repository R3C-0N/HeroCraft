[package]
name = "herocraft_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "herocraft_client"
path = "src/main.rs"

[dependencies]
herocraft_common = { path = "../common" }
herocraft_voxel_engine = { path = "../voxel_engine" }
herocraft_world = { path = "../world" }
herocraft_server = { path = "../server" }
herocraft_meshing = { path = "../meshing" }
glam = { workspace = true }
mimalloc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
wgpu = { version = "30", features = ["naga-ir"] }
winit = { version = "0.29", features = ["serde"] }
pollster = "0.3"
dotenvy = "0.15"
bytemuck = { version = "1.18", features = ["derive"] }
rayon = "1.10"
thread-priority = "3"
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = "0.37"
naga = "30"
naga_oil = { version = "0.23", default-features = false }
# Son : mixage et sortie audio (les sons sont synthétisés par le jeu, aucun décodeur requis)
rodio = { version = "0.23", default-features = false, features = ["playback"] }
png = "0.17"
base64 = "0.22"

# Son sous Linux : PulseAudio (et PipeWire) d'abord, ALSA en secours. WSLg n'expose que PulseAudio.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

# Crochet clavier : les touches du jeu passent avant PowerToys et les autres programmes
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[features]
# cargo run --release --features profiling --bin herocraft_client
profiling = ["herocraft_common/profiling"]
# cargo run --release --features tracy --bin herocraft_client, puis l'interface de Tracy (docs/PROFILAGE.md)
tracy = ["profiling", "herocraft_common/tracy"]

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
