[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/world",
    "crates/voxel_engine",
    "crates/meshing",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HeroCraft Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
# Encodage binaire des paquets réseau et des annonces LAN (bincode 1 n'est plus maintenu)
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
rustc-hash = "2"
mimalloc = { version = "0.1", default-features = false }

# La compilation incrémentale reste active (défaut de Cargo). Pour compiler depuis
# Windows sur un partage WSL (\\wsl.localhost\...), où elle provoque des erreurs de
# verrouillage, la désactiver côté Windows seulement : voir le README.

# Dépendances optimisées (le jeu reste fluide en debug), sans infos de débogage :
# elles alourdissaient la compilation à froid et le dossier target sans servir
# au débogage du code du projet.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Version à distribuer : LTO complète, plus lente à compiler que `release`, quelques pour cent de
# CPU en plus. cargo build --profile distribution ; avec un profil d'exécution (PGO), voir
# docs/PROFILAGE.md.
[profile.distribution]
inherits = "release"
lto = "fat"
