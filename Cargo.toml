[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/world",
    "crates/voxel_engine",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HeroCraft Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"
env_logger = "0.11"
rand = "0.8"

# Désactivation de la compilation incrémentale pour éviter les erreurs de verrouillage
# sur les systèmes de fichiers réseau / partages WSL (\\wsl.localhost\...)
[profile.dev]
incremental = false

[profile.test]
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
